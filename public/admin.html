<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOTO15 Admin</title><style>body{font-family:Arial;background:#07090d;color:#fff;max-width:900px;margin:30px auto;padding:0 16px}input,button{padding:12px;border-radius:10px;border:1px solid #555;background:#111827;color:#fff}button{cursor:pointer;background:#f5c842;color:#111;font-weight:800}.row{display:flex;gap:8px;margin-bottom:16px}.card{border:1px solid #334155;border-radius:14px;padding:16px;margin:12px 0}pre{white-space:pre-wrap;word-break:break-word}</style><h1>LOTO15 — Centro Administrativo</h1><div class="row"><input id="key" placeholder="ADMIN_KEY" style="flex:1"><button onclick="loadData()">CONSULTAR</button></div><div id="out"></div><script>async function loadData(){const k=document.getElementById('key').value;const h={'x-admin-key':k};const [a,b]=await Promise.all([fetch('/api/admin/summary',{headers:h}),fetch('/api/admin/events',{headers:h})]);const s=await a.json(),e=await b.json();document.getElementById('out').innerHTML='<div class="card"><h2>Resumo</h2><pre>'+esc(JSON.stringify(s,null,2))+'</pre></div><div class="card"><h2>Eventos</h2><pre>'+esc(JSON.stringify(e,null,2))+'</pre></div>'}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</script>
